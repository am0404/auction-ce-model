[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ceauction"
version = "0.1.0"
description = "Championship-equity simulation for a 12-team half-PPR Sleeper auction league"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The certified completion solver only. NOT required to run the draft-day
# dashboard, the market guardrail, or any existing command: `ceauction.auction.
# certified` is imported nowhere at package import time and reports
# CERTIFIED_SOLVER_NO_GO rather than raising when highspy is absent.
solver = ["highspy>=1.7"]

[project.scripts]
ce-lab = "ceauction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = [
    # The auction layer's buy/pass comparison runs two full completion
    # searches and simulates finalists on two independent samples, so a
    # single one costs seconds. Tests built on it are marked so a developer
    # can run `pytest -m "not slow"` for a fast pass and the full suite
    # before committing. Nothing is skipped by default.
    "slow: exercises the auction search end to end; seconds per test",
]
